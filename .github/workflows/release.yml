name: Release

# Push a tag v<version> (matching composer.json) on a commit that passed CI;
# this builds serversuite.blueprint + the backend zip and creates the GitHub
# release with both attached. See tools/release.py.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the release and upload its assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # checkout can leave the pushed tag lightweight; the annotated tag's
      # message marks a security release (tools/release.py).
      - name: Fetch the tag object
        run: git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
      - name: Build and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/release.py "${{ github.ref_name }}" --publish
