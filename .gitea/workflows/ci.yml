name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: PHP lint (8.2) + package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"   # lowest PHP the panels support
          tools: none
          coverage: none
      - name: php -l
        run: |
          find src tests database config routes extension -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l -d display_errors=1 > /dev/null
      - name: serversuite.blueprint matches extension/, versions match
        run: python3 tools/build-blueprint.py --check

  tests:
    name: Pest (Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pterodactyl 1.14 is on Laravel 11, 1.15 on Laravel 12.
          - laravel: "11"
            testbench: "^9.0"
            pest: "^2.0"
          - laravel: "12"
            testbench: "^10.0"
            pest: "^3.0"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-tests-l${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-tests-l${{ matrix.laravel }}-
      - name: Pin Laravel ${{ matrix.laravel }}
        run: |
          composer require --no-update --no-interaction \
            "illuminate/support:^${{ matrix.laravel }}.0" "illuminate/database:^${{ matrix.laravel }}.0" \
            "illuminate/http:^${{ matrix.laravel }}.0" "illuminate/console:^${{ matrix.laravel }}.0" \
            "illuminate/events:^${{ matrix.laravel }}.0"
          composer require --dev --no-update --no-interaction \
            "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}"
      # Laravel 11 is out of security support and every 11.x release has open
      # advisories, which Composer >= 2.10 refuses to install. Pterodactyl 1.14
      # ships on it anyway, so allow it for this test-only leg.
      - name: Allow advisory-affected laravel/framework (Laravel 11 only)
        if: matrix.laravel == '11'
        run: composer config policy.advisories.ignore --json '["laravel/framework"]'
      - name: composer update
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: Pest
        run: vendor/bin/pest --colors=never

  panel:
    name: Pterodactyl ${{ matrix.panel }} (install + PHPStan)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        panel: [v1.14.0, v1.15.1]
    env:
      PANEL: ${{ github.workspace }}/../panel
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          # the panel's composer.json ext-* requirements (+ bcmath for s1lentium/iptools)
          extensions: bcmath, mbstring, pdo, pdo_mysql, posix, zip
          tools: composer:v2
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-panel-${{ matrix.panel }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-panel-${{ matrix.panel }}-
      - name: Clone pterodactyl/panel ${{ matrix.panel }}
        run: git clone --quiet --depth 1 --branch "${{ matrix.panel }}" https://github.com/pterodactyl/panel.git "$PANEL"
      - name: Install the package into the panel (as INSTALL.md does)
        working-directory: ${{ env.PANEL }}
        run: |
          cp .env.example .env
          composer config repositories.serversuite \
            "{\"type\":\"path\",\"url\":\"$GITHUB_WORKSPACE\",\"options\":{\"symlink\":false}}"
          composer require --no-interaction --no-progress --prefer-dist "pterodactyl-serversuite/serversuite:*"
      - name: Service provider boots, commands register
        working-directory: ${{ env.PANEL }}
        run: |
          php artisan package:discover
          php artisan list --raw > "$RUNNER_TEMP/commands.txt"
          for c in serversuite:check-updates serversuite:rotate-backups serversuite:move-subdomains; do
            grep -q "^$c " "$RUNNER_TEMP/commands.txt" || { echo "::error::$c not registered"; exit 1; }
          done
      - name: Server Suite permission groups are grantable (#17), activity labels merge (#19), billing API routes (#38)
        working-directory: ${{ env.PANEL }}
        run: |
          php -r '
            require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $allowed = Pterodactyl\Models\Permission::permissions()->map(fn ($v, $p) => array_map(fn ($k) => "$p.$k", array_keys($v["keys"])))->flatten()->all();
            foreach (["mods.read", "mods.install", "subdomains.manage", "backup.read"] as $p) {
                if (! in_array($p, $allowed, true)) { fwrite(STDERR, "::error::$p is not grantable\n"); exit(1); }
            }
            echo "permission groups ok\n";
            $activity = app("translator")->getLoader()->load("en", "activity");
            if (! isset($activity["server"]["serversuite"]["mod-removed"], $activity["server"]["file"])) { fwrite(STDERR, "::error::activity labels not merged with the panel ones\n"); exit(1); }
            echo "activity labels ok\n";
            foreach (["GET" => "api/application/serversuite/servers/{ref}", "PUT" => "api/application/serversuite/servers/{ref}/subdomains"] as $m => $uri) {
                $r = collect(app("router")->getRoutes()->getRoutes())->first(fn ($r) => $r->uri() === $uri && in_array($m, $r->methods(), true));
                if (! $r || ! in_array("application-api", $r->gatherMiddleware(), true)) { fwrite(STDERR, "::error::billing API route $m $uri missing or not behind application-api\n"); exit(1); }
            }
            echo "billing API routes ok\n";
          '
      - name: PHPStan against the panel source
        working-directory: ${{ env.PANEL }}
        run: |
          cp -r "$GITHUB_WORKSPACE/extension" serversuite-blueprint
          php -d memory_limit=1G vendor/bin/phpstan analyse -c "$GITHUB_WORKSPACE/.ci/phpstan.neon" --no-progress

  extension:
    name: Extension typecheck (Pterodactyl ${{ matrix.panel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        panel: [v1.14.0, v1.15.1]
    env:
      PANEL: ${{ github.workspace }}/../panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # panel package.json: engines.node >= 22
      - name: Clone pterodactyl/panel ${{ matrix.panel }}
        run: git clone --quiet --depth 1 --branch "${{ matrix.panel }}" https://github.com/pterodactyl/panel.git "$PANEL"
      - uses: actions/cache@v4
        with:
          path: ${{ env.PANEL }}/node_modules
          key: panel-node-modules-${{ matrix.panel }}
      - name: yarn install (panel frontend)
        working-directory: ${{ env.PANEL }}
        run: |
          corepack enable
          # retry: the registry occasionally 502s mid-install
          for i in 1 2 3; do
            yarn install --frozen-lockfile --non-interactive --silent --network-timeout 300000 && exit 0
            echo "::warning::yarn install failed (attempt $i), retrying"; sleep 15
          done
          exit 1
      # The panel's tsconfig covers resources/scripts/**, so dropping the
      # components where Blueprint installs them typechecks them against the
      # real panel frontend (@/api/http, @/state/server, twin.macro, ...).
      - name: tsc
        working-directory: ${{ env.PANEL }}
        run: |
          cp -r "$GITHUB_WORKSPACE/extension/resources/scripts/components/server/serversuite" \
            resources/scripts/components/server/serversuite
          yarn -s tsc
      - name: Build serversuite.blueprint
        if: matrix.panel == 'v1.14.0'
        run: python3 tools/build-blueprint.py -o "$RUNNER_TEMP/serversuite.blueprint"
      - uses: actions/upload-artifact@v3
        if: matrix.panel == 'v1.14.0'
        with:
          name: serversuite.blueprint
          path: ${{ runner.temp }}/serversuite.blueprint
